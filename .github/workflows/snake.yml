name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FF69B4&color_dots=%23F8BBD0,%23EF93C4,%23FF69B4,%23D96BA8,%23B84C8A
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23FF69B4&color_dots=%23161616,%23F8BBD0,%23EF93C4,%23FF69B4,%23D96BA8

      - name: Publish contribution snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
